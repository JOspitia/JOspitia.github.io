         hreflang annotations are self-referential. This still helps
         crawlers confirm the entity is bilingual and avoids ambiguity
         when social/AI agents snapshot the page. -->

    <!-- PWA manifest + iOS home-screen icon. apple-touch-icon is the

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Preconnect for Google Fonts cuts the TLS handshake cost on the
         first paint. display=swap keeps the body text visible with the
         system fallback while Inter loads. The woff2 preload shaves
         ~80ms off LCP because the font fetch starts in parallel with
         the CSS parse.

         JetBrains Mono is the secondary face used for headings,
         section markers, the status bar, and the ASCII tree in the
         Skills section. Loading both in one request is fine — Google
         serves a combined CSS that streams to the browser. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
      href="https://fonts.gstatic.com/s/inter/v18/UcCo3FwrK3iLTcvneQ.woff2"
      crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" />

    <!-- Preload the WebP variant of the LCP image (Hero avatar) so the
         above-the-fold photo does not block first paint. WebP is 63%
         smaller than the source JPEG (116 KB → 43 KB at q=82) so the
         LCP improvement is material on slow connections. -->
    <link

      as="image"
      href="/foto.webp"
