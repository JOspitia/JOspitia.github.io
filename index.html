    <meta name="theme-color" content="#3b82f6" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary SEO: title is sized to ~57 chars (target 50-60). Front-loads
         primary keyword "Full-Stack Developer" + secondary "QA Automation" +
         geo "Cali" so both Google and AI engines can extract a clean entity
         signature from the <title> alone. -->
    <title>Johan Ospitia — Full-Stack &amp; QA Engineer · Cali, Colombia</title>

    <!-- Meta description tuned to ~158 chars (target 150-160). Includes the
         three primary keyword clusters, the geo modifier, a verifiable
         numeric proof point, and an explicit "Open to remote" CTA so the
         snippet answers "who/what/where/availability" without a click. -->
    <meta
      name="description"
      content="Full-Stack Developer & QA Automation Engineer in Cali, Colombia. 4+ years building TypeScript, React, Java, Spring Boot & Playwright apps. Open to remote work."
    />

    <!-- robots: allow full indexing of the homepage; reference to sitemap
         via robots.txt (already present in /public). No imageindex /
         noarchive opt-outs so the profile image and CV stay in image search. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta name="author" content="Johan Daniel Ospitia Yaguara" />
    <meta name="generator" content="React + Vite" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <meta name="revisit-after" content="14 days" />

    <!-- Canonical + hreflang. The SPA serves both ES and EN at the same
         URL (locale is selected client-side via i18next), so the
         hreflang annotations are self-referential. This still helps
         crawlers confirm the entity is bilingual and avoids ambiguity
         when social/AI agents snapshot the page. -->
    <link rel="canonical" href="https://jospitia.github.io/" />
    <link rel="alternate" hreflang="en" href="https://jospitia.github.io/" />
    <link rel="alternate" hreflang="es" href="https://jospitia.github.io/" />
    <link rel="alternate" hreflang="x-default" href="https://jospitia.github.io/" />

    <!-- Icons. The repo ships only favicon.svg; we still declare the SVG
         explicitly with sizes for modern browsers, plus a mask-icon for
         Safari pinned-tab styling. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b82f6" />

    <!-- Preconnect for Google Fonts cuts the TLS handshake cost on the
         first paint. display=swap keeps the body text visible with the
         system fallback while Inter loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />

    <!-- Preload the LCP image (Hero avatar) so the above-the-fold photo
         does not block first paint. -->
    <link rel="preload" as="image" href="/foto.jpg" />

       /// The SearchAction is intentionally omitted (no on-site search),
       /// which is preferred over a broken action. -->

    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://jospitia.github.io/#website",
      "url": "https://jospitia.github.io/",
      "name": "Johan Ospitia — Portfolio",
      "alternateName": "Portafolio de Johan Ospitia",
      "inLanguage": ["en", "es"],

      "copyrightHolder": { "@id": "https://jospitia.github.io/#person" },
      "image": "https://jospitia.github.io/og-image.png"
    }
    </script>
