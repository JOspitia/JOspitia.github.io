<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <title>Johan Ospitia — Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Johan Ospitia, Full-Stack Developer specializing in TypeScript, React, and accessible web products." />
    <meta name="author" content="Johan Ospitia" />

    <!-- Google Search Console verification token (do not remove even after
         verification completes — required to keep the property verified). -->
    <meta name="google-site-verification" content="wN6vgsPTHgafS5375BQe2unxz_vsWAbJEYike5VTASY" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Johan Ospitia — Full-Stack Developer" />
    <meta property="og:description" content="Portfolio of Johan Ospitia, Full-Stack Developer specializing in TypeScript, React, and accessible web products." />
    <meta property="og:url" content="https://jospitia.github.io" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Johan Ospitia — Full-Stack Developer" />
    <meta name="twitter:description" content="Portfolio of Johan Ospitia, Full-Stack Developer specializing in TypeScript, React, and accessible web products." />

    <!-- Inter via Google Fonts (weights 400 + 600). Preconnect cuts TLS
         handshake cost; display=swap keeps text visible with the system
         fallback while Inter loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />

    <!-- JSON-LD: Schema.org Person. Google reads this to build the knowledge
         graph entry for the site owner. sameAs links GitHub, LinkedIn and
         the contact email so search can correlate identities. jobTitle and
         description are single strings (Schema.org has no native i18n), so
         we use neutral English to maximize the global technical audience.
         Reference: https://schema.org/Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Johan Ospitia",
      "url": "https://jospitia.github.io/",
      "jobTitle": "Full-Stack Developer & QA Automation Lead",
      "description": "Professional portfolio of Johan Ospitia. Specialist in QA Automation, web development, and AI integration.",
      "sameAs": [
        "https://github.com/JOspitia",
        "https://www.linkedin.com/in/johan-ospitia/",
        "mailto:jjohanospitia@gmail.com"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
